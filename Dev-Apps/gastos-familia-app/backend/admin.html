<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Admin - Gastos Família</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #e6edf3;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 40px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 20px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #58a6ff, #79c0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #8b949e;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid #30363d;
    }

    .tab-btn {
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: #58a6ff;
      border-bottom-color: #58a6ff;
    }

    .tab-btn:hover {
      color: #79c0ff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #30363d;
    }

    .card-code {
      font-family: monospace;
      font-size: 14px;
      font-weight: 600;
      color: #58a6ff;
    }

    .card-email {
      color: #8b949e;
      font-size: 13px;
    }

    .card-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .info-item {
      background: #0d1117;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }

    .info-label {
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 14px;
      color: #e6edf3;
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-approve {
      background: linear-gradient(135deg, #238636, #2ea043);
      color: white;
      flex: 1;
    }

    .btn-approve:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
    }

    .btn-approve:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending {
      background: rgba(88, 166, 255, 0.2);
      color: #58a6ff;
    }

    .status-approved {
      background: rgba(63, 185, 80, 0.2);
      color: #3fb950;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #8b949e;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #8b949e;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f3a1a;
      color: #3fb950;
      padding: 16px 20px;
      border-radius: 8px;
      border-left: 4px solid #3fb950;
      display: none;
      z-index: 1000;
    }

    .toast.show {
      display: block;
      animation: slideIn 0.3s;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔐 Painel de Admin</h1>
      <p>Gastos Família — Gerenciar Pagamentos via Pix</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('pending')">
        📲 Pendentes <span id="badge-pending" style="margin-left: 8px;">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('approved')">
        ✅ Aprovados <span id="badge-approved" style="margin-left: 8px;">0</span>
      </button>
    </div>

    <!-- Tab Pendentes -->
    <div id="pending" class="tab-content active">
      <div id="pending-loading" class="loading">
        <div class="spinner"></div>
        <p>Carregando...</p>
      </div>
      <div id="pending-content" style="display: none;"></div>
    </div>

    <!-- Tab Aprovados -->
    <div id="approved" class="tab-content">
      <div id="approved-loading" class="loading">
        <div class="spinner"></div>
        <p>Carregando...</p>
      </div>
      <div id="approved-content" style="display: none;"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = 'http://localhost:3001';

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tab).classList.add('active');
      event.target.closest('.tab-btn').classList.add('active');

      loadData(tab);
    }

    async function loadData(tab) {
      const endpoint = tab === 'pending'
        ? '/api/pending-pix-confirmations'
        : '/api/approved-pix-confirmations';

      const loadingEl = document.getElementById(`${tab}-loading`);
      const contentEl = document.getElementById(`${tab}-content`);

      loadingEl.style.display = 'block';
      contentEl.style.display = 'none';

      try {
        const response = await fetch(`${API_BASE}${endpoint}`);
        const data = await response.json();

        document.getElementById(`badge-${tab}`).textContent = data.count;

        if (data.count === 0) {
          contentEl.innerHTML = `
            <div class="empty">
              <div class="empty-icon">${tab === 'pending' ? '😴' : '🎉'}</div>
              <p>${tab === 'pending' ? 'Nenhum pagamento pendente' : 'Nenhum pagamento aprovado ainda'}</p>
            </div>
          `;
        } else {
          contentEl.innerHTML = data.confirmations
            .map(conf => renderCard(conf, tab))
            .join('');
        }

        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
      } catch (error) {
        contentEl.innerHTML = `<div class="empty"><p>❌ Erro ao carregar: ${error.message}</p></div>`;
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
      }
    }

    function renderCard(conf, tab) {
      const date = new Date(conf.timestamp).toLocaleDateString('pt-BR', {
        hour: '2-digit',
        minute: '2-digit'
      });

      return `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-code">${conf.code}</div>
              <div class="card-email">${conf.email}</div>
            </div>
            <span class="status-badge status-${conf.status}">${
              conf.status === 'pending' ? 'Aguardando' : 'Aprovado'
            }</span>
          </div>

          <div class="card-info">
            <div class="info-item">
              <div class="info-label">Valor</div>
              <div class="info-value">R$ ${conf.amount.toFixed(2)}</div>
            </div>
            <div class="info-item">
              <div class="info-label">Data/Hora</div>
              <div class="info-value">${date}</div>
            </div>
            ${conf.approvedAt ? `
              <div class="info-item">
                <div class="info-label">Aprovado em</div>
                <div class="info-value">${new Date(conf.approvedAt).toLocaleDateString('pt-BR', {
                  hour: '2-digit',
                  minute: '2-digit'
                })}</div>
              </div>
            ` : ''}
          </div>

          <div class="card-actions">
            ${conf.status === 'pending' ? `
              <button class="btn-approve" onclick="approvePix('${conf.code}', '${conf.email}')">
                ✅ Liberar Acesso
              </button>
            ` : `
              <button class="btn-approve" disabled>
                ✅ Já Aprovado
              </button>
            `}
          </div>
        </div>
      `;
    }

    async function approvePix(code, email) {
      try {
        const response = await fetch(`${API_BASE}/api/approve-pix`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            confirmationCode: code,
            email: email
          })
        });

        const data = await response.json();

        if (data.success) {
          showToast(`✅ Acesso liberado para ${email}`);
          loadData('pending');
          loadData('approved');
        } else {
          showToast(`❌ Erro: ${data.error}`);
        }
      } catch (error) {
        showToast(`❌ Erro: ${error.message}`);
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Carregar dados inicialmente
    loadData('pending');
  </script>
</body>
</html>
